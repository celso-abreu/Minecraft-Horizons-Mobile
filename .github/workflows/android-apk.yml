name: Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build arm64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out repository and pinned Horizon source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, Build Tools, and NDK
        id: android_sdk_setup
        uses: android-actions/setup-android@v3
        continue-on-error: true
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Verify Android SDK packages and publish diagnostics
        id: android_sdk_diagnostics
        shell: bash
        run: |
          set +e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          LOG="$RUNNER_TEMP/android-sdk-manager.log"
          : > "$LOG"
          status=0

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "Could not locate sdkmanager. ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" | tee -a "$LOG"
            status=127
          else
            {
              echo "sdkmanager path: $SDKMANAGER"
              echo "Android SDK root: $SDK_ROOT"
              echo "Java version:"
              java -version
            } >> "$LOG" 2>&1

            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses 2>&1 | tee -a "$LOG"
            license_status=${PIPESTATUS[1]}
            if [[ "$license_status" -ne 0 ]]; then
              status="$license_status"
            else
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" --verbose \
                "platform-tools" \
                "platforms;android-35" \
                "build-tools;35.0.0" \
                "ndk;27.2.12479018" 2>&1 | tee -a "$LOG"
              status=${PIPESTATUS[0]}
            fi
          fi

          {
            echo "## Android SDK package setup"
            echo "- setup-android action outcome: `${{ steps.android_sdk_setup.outcome }}`"
            echo "- sdkmanager exit status: `$status`"
            echo
            echo '```text'
            tail -n 160 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" -ne 0 ]]; then
            snippet="$(tail -c 8000 "$LOG" | tr '\r\n' '  ' | sed 's/%/%25/g')"
            echo "::error title=Android SDK install diagnostic::${snippet}"
            exit "$status"
          fi

      - name: Set up Rust 1.95 and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            android/native-host -> target
          shared-key: android-aarch64

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: android_build
        shell: bash
        working-directory: android
        run: |
          set +e
          LOG="$RUNNER_TEMP/gradle-build.log"
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}

          if [[ "$status" -ne 0 ]]; then
            snippet="$(python3 - "$LOG" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          failure = next((i for i, line in enumerate(lines) if line.startswith("FAILURE:")), None)
          if failure is None:
              selected = lines[-120:]
          else:
              start = max(0, failure - 80)
              limit = min(len(lines), failure + 80)
              end = next((i for i in range(failure + 1, limit) if lines[i].startswith("* Try:")), limit)
              selected = lines[start:end]
          text = chr(10).join(selected)[-12000:]
          sys.stdout.write(text.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A"))
          PY
            )"
            echo "::error title=Gradle build log tail::${snippet}"
          fi
          exit "$status"

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/android-sdk-manager.log
            ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-horizons-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
